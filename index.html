  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- 1. INDEXED DB STORAGE ENGINE ---
    const DB_NAME = 'TaskFlowVN_DB';
    const DB_VERSION = 1;
    const STORE_TASKS = 'tasks';
    const STORE_SETTINGS = 'settings';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_TASKS)) {
            const taskStore = db.createObjectStore(STORE_TASKS, { keyPath: 'id' });
            taskStore.createIndex('dueDate', 'dueDate', { unique: false });
            taskStore.createIndex('status', 'status', { unique: false });
          }
          if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
            db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    };

    const dbGetAllTasks = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_TASKS, 'readonly');
        const store = tx.objectStore(STORE_TASKS);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    };

    const dbSaveTask = async (task) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_TASKS, 'readwrite');
        const store = tx.objectStore(STORE_TASKS);
        const req = store.put(task);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const dbDeleteTask = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_TASKS, 'readwrite');
        const store = tx.objectStore(STORE_TASKS);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    };

    const dbSaveAllTasks = async (tasks) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_TASKS, 'readwrite');
        const store = tx.objectStore(STORE_TASKS);
        store.clear().onsuccess = () => {
          tasks.forEach(t => store.put(t));
          resolve();
        };
      });
    };

    const dbGetSettings = async () => {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_SETTINGS, 'readonly');
        const store = tx.objectStore(STORE_SETTINGS);
        const req = store.getAll();
        req.onsuccess = () => {
          const res = req.result || [];
          const settingsObj = {};
          res.forEach(item => { settingsObj[item.key] = item.value; });
          resolve(settingsObj);
        };
        req.onerror = () => resolve({});
      });
    };

    const dbSaveSetting = async (key, value) => {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_SETTINGS, 'readwrite');
        const store = tx.objectStore(STORE_SETTINGS);
        store.put({ key, value });
        tx.oncomplete = () => resolve();
      });
    };

    // --- 2. SAMPLE INITIAL DATA ---
    const INITIAL_TASKS = [
      {
        id: 'task-1700000000001',
        title: 'Báo cáo doanh số tháng & Kế hoạch quý mới',
        description: 'Tổng hợp số liệu kinh doanh từ các chi nhánh và gửi cho Giám đốc trước 17:00.',
        category: 'Công việc',
        priority: 'Cao',
        status: 'pending',
        dueDate: new Date(Date.now() + 86400000).toISOString().slice(0, 16),
        leadTime: '30m',
        sequence: 1,
        subtasks: [
          { id: 'sub-1', title: 'Thu thập bảng số liệu Excel từ phòng Kế toán', completed: true },
          { id: 'sub-2', title: 'Vẽ biểu đồ tăng trưởng và làm slide báo cáo', completed: false }
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: 'task-1700000000002',
        title: 'Học 30 từ vựng tiếng Anh chuyên ngành',
        description: 'Ôn tập thẻ Flashcards chủ đề Technology & Productivity.',
        category: 'Học tập',
        priority: 'Trung bình',
        status: 'in_progress',
        dueDate: new Date(Date.now() + 172800000).toISOString().slice(0, 16),
        leadTime: '15m',
        sequence: 1,
        subtasks: [
          { id: 'sub-3', title: 'Luyện phát âm qua app Quizlet', completed: true }
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: 'task-1700000000003',
        title: 'Bảo dưỡng xe máy & Thay nhớt định kỳ',
        description: 'Đưa xe ra tiệm Head Honda kiểm tra phanh và thay dầu máy.',
        category: 'Cá nhân',
        priority: 'Thấp',
        status: 'pending',
        dueDate: new Date(Date.now() + 259200000).toISOString().slice(0, 16),
        leadTime: '1h',
        sequence: 1,
        subtasks: [],
        createdAt: new Date().toISOString()
      },
      {
        id: 'task-1700000000004',
        title: 'Mua quà sinh nhật cho Mẹ',
        description: 'Đặt hoa tươi và chọn món quà ý nghĩa gia đình.',
        category: 'Gia đình',
        priority: 'Cao',
        status: 'completed',
        dueDate: new Date(Date.now() - 3600000).toISOString().slice(0, 16),
        leadTime: '30m',
        sequence: 1,
        subtasks: [
          { id: 'sub-4', title: 'Đặt bánh kem bắp ở tiệm', completed: true }
        ],
        createdAt: new Date().toISOString()
      }
    ];

    // --- 3. WEB AUDIO CHIME & SOUND EFFECTS ---
    const playAudioChime = (type = 'success') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'success') {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } else if (type === 'pomodoro') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        }
      } catch (e) {
        console.warn('Audio not allowed yet:', e);
      }
    };

    const triggerHaptic = () => {
      if (navigator.vibrate) {
        navigator.vibrate([30, 50, 30]);
      }
    };

    // --- 4. CALENDAR GENERATOR & PHONE DIRECT SYNC LOGIC ---
    const leadTimeToMinutes = (leadStr) => {
      switch (leadStr) {
        case '0m': return 0;
        case '15m': return 15;
        case '30m': return 30;
        case '1h': return 60;
        case '1d': return 1440;
        default: return 30;
      }
    };

    const formatICalDate = (dateObj) => {
      return dateObj.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    };

    const generateSingleICS = (task) => {
      const dtDue = task.dueDate ? new Date(task.dueDate) : new Date(Date.now() + 3600000);
      const dtStart = new Date(dtDue.getTime() - 30 * 60 * 1000); // 30 mins event duration
      const leadMin = leadTimeToMinutes(task.leadTime);
      const sequence = task.sequence || 1;

      let subtasksText = '';
      if (task.subtasks && task.subtasks.length > 0) {
        subtasksText = '\\n\\nViệc phụ:\\n' + task.subtasks.map(s => `- [${s.completed ? 'X' : ' '}] ${s.title}`).join('\\n');
      }

      const icsLines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//TaskFlow Viet//NONSGML Task Calendar//VI',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:task-${task.id}@taskflow.vn`,
        `SEQUENCE:${sequence}`,
        `DTSTAMP:${formatICalDate(new Date())}`,
        `DTSTART:${formatICalDate(dtStart)}`,
        `DTEND:${formatICalDate(dtDue)}`,
        `SUMMARY:[TaskFlow] ${task.title}`,
        `DESCRIPTION:Hạn chót: ${task.dueDate || 'Chưa đặt'}\\nMức độ: ${task.priority || 'Trung bình'}\\nDanh mục: ${task.category || 'Chung'}${task.description ? '\\n\\nGhi chú: ' + task.description : ''}${subtasksText}`,
        'STATUS:CONFIRMED',
        'BEGIN:VALARM',
        `TRIGGER:-PT${leadMin}M`,
        'ACTION:DISPLAY',
        `DESCRIPTION:Nhắc nhở: ${task.title}`,
        'END:VALARM',
        'BEGIN:VALARM',
        'TRIGGER:-PT5M',
        'ACTION:AUDIO',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ];
      return icsLines.join('\r\n');
    };

    const syncTaskToCalendar = (task, showToast) => {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(navigator.userAgent);
      const icsContent = generateSingleICS(task);

      if (isIOS) {
        // Direct Native Apple Calendar Opening via Data URI (Zero Download)
        const encodedIcs = encodeURIComponent(icsContent);
        const dataUri = `data:text/calendar;charset=utf-8,${encodedIcs}`;
        window.location.href = dataUri;
        if (showToast) showToast('Đang mở ứng dụng Lịch Apple...', 'info');
      } else if (isAndroid) {
        // Direct Intent to Google Calendar App / Render Template (Zero Download)
        const dtDue = task.dueDate ? new Date(task.dueDate) : new Date(Date.now() + 3600000);
        const dtStart = new Date(dtDue.getTime() - 30 * 60 * 1000);
        const formatGCal = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
        
        let details = task.description || '';
        if (task.subtasks && task.subtasks.length > 0) {
          details += '\n\nViệc phụ:\n' + task.subtasks.map(s => `- [${s.completed ? 'X' : ' '}] ${s.title}`).join('\n');
        }

        const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('[TaskFlow] ' + task.title)}&dates=${formatGCal(dtStart)}/${formatGCal(dtDue)}&details=${encodeURIComponent(details)}&add=${encodeURIComponent('taskflow@app')}`;
        
        window.open(gCalUrl, '_blank');
        if (showToast) showToast('Đã mở Google Lịch để lưu!', 'success');
      } else {
        // Desktop PC fallback: Open Google Calendar template in new tab + trigger file download
        const dtDue = task.dueDate ? new Date(task.dueDate) : new Date(Date.now() + 3600000);
        const dtStart = new Date(dtDue.getTime() - 30 * 60 * 1000);
        const formatGCal = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
        
        const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('[TaskFlow] ' + task.title)}&dates=${formatGCal(dtStart)}/${formatGCal(dtDue)}&details=${encodeURIComponent(task.description || '')}`;
        window.open(gCalUrl, '_blank');

        // Also offer quick .ics file download for Outlook / Desktop Calendar
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `task-${task.id}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        if (showToast) showToast('Đã mở Lịch và tải file .ics!', 'success');
      }
    };

    const exportAllTasksICS = (tasks) => {
      if (!tasks || tasks.length === 0) return '';
      const uncompleted = tasks.filter(t => t.status !== 'completed');
      if (uncompleted.length === 0) return '';

      let eventsList = [];
      uncompleted.forEach(task => {
        const dtDue = task.dueDate ? new Date(task.dueDate) : new Date(Date.now() + 3600000);
        const dtStart = new Date(dtDue.getTime() - 30 * 60 * 1000);
        const leadMin = leadTimeToMinutes(task.leadTime);
        eventsList.push([
          'BEGIN:VEVENT',
          `UID:task-${task.id}@taskflow.vn`,
          `SEQUENCE:${task.sequence || 1}`,
          `DTSTAMP:${formatICalDate(new Date())}`,
          `DTSTART:${formatICalDate(dtStart)}`,
          `DTEND:${formatICalDate(dtDue)}`,
          `SUMMARY:[TaskFlow] ${task.title}`,
          `DESCRIPTION:${task.description || ''}`,
          'BEGIN:VALARM',
          `TRIGGER:-PT${leadMin}M`,
          'ACTION:DISPLAY',
          `DESCRIPTION:Nhắc nhở: ${task.title}`,
          'END:VALARM',
          'END:VEVENT'
        ].join('\r\n'));
      });

      return [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//TaskFlow Viet Batch Export//VI',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        ...eventsList,
        'END:VCALENDAR'
      ].join('\r\n');
    };

    // --- 5. MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [tasks, setTasks] = useState([]);
      const [settings, setSettings] = useState({
        darkMode: true,
        autoCalendarSync: false,
        defaultLeadTime: '30m',
        firebaseUrl: '',
        firebaseRoomId: 'my-room-1',
      });

      const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'tasks', 'pomodoro', 'settings'
      const [viewMode, setViewMode] = useState('list'); // 'list' | 'kanban'
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterPriority, setFilterPriority] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL'); // ALL, TODAY, UPCOMING, OVERDUE

      // Modal states
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [toast, setToast] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);

      // Pomodoro Timer States
      const [pomoMode, setPomoMode] = useState(25 * 60); // 25m, 5m, 15m
      const [pomoTimeLeft, setPomoTimeLeft] = useState(25 * 60);
      const [isPomoRunning, setIsPomoRunning] = useState(false);
      const [pomoSelectedTask, setPomoSelectedTask] = useState('');
      const [pomoSessions, setPomoSessions] = useState(0);

      // Mobile Touch Gesture Swipe state
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const touchEndX = useRef(0);

      // Storage Info
      const [dbStorageInfo, setDbStorageInfo] = useState({ count: 0, sizeKb: '0' });

      const showToast = useCallback((msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      }, []);

      // Load initial data from IndexedDB
      useEffect(() => {
        const loadInitialData = async () => {
          try {
            let dbTasks = await dbGetAllTasks();
            if (!dbTasks || dbTasks.length === 0) {
              await dbSaveAllTasks(INITIAL_TASKS);
              dbTasks = INITIAL_TASKS;
            }
            setTasks(dbTasks);

            const dbSetts = await dbGetSettings();
            setSettings(prev => ({ ...prev, ...dbSetts }));

            if (dbSetts.darkMode !== undefined) {
              if (dbSetts.darkMode) document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          } catch (err) {
            console.error('IndexedDB load failed:', err);
            setTasks(INITIAL_TASKS);
          }
        };
        loadInitialData();
      }, []);

      // Calculate IndexedDB usage
      useEffect(() => {
        const calcSize = () => {
          const jsonStr = JSON.stringify(tasks);
          const kb = (jsonStr.length / 1024).toFixed(2);
          setDbStorageInfo({ count: tasks.length, sizeKb: kb });
        };
        calcSize();
      }, [tasks]);

      // Pomodoro Timer Tick Effect
      useEffect(() => {
        let interval = null;
        if (isPomoRunning && pomoTimeLeft > 0) {
          interval = setInterval(() => {
            setPomoTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (pomoTimeLeft === 0 && isPomoRunning) {
          setIsPomoRunning(false);
          playAudioChime('pomodoro');
          triggerHaptic();
          setPomoSessions(prev => prev + 1);
          showToast('Đã hoàn thành 1 phiên Pomodoro xuất sắc!', 'success');
        }
        return () => clearInterval(interval);
      }, [isPomoRunning, pomoTimeLeft, showToast]);

      // Toggle Theme Dark/Light
      const toggleDarkMode = async () => {
        const newDark = !settings.darkMode;
        const newSetts = { ...settings, darkMode: newDark };
        setSettings(newSetts);
        await dbSaveSetting('darkMode', newDark);
        if (newDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      };

      // Save or Update Task
      const handleSaveTask = async (taskData) => {
        try {
          let updatedTasks = [];
          if (taskData.id) {
            // Edit existing task
            const existing = tasks.find(t => t.id === taskData.id);
            const updated = {
              ...taskData,
              sequence: (existing?.sequence || 1) + 1, // Increment sequence for ICS sync override
              updatedAt: new Date().toISOString()
            };
            await dbSaveTask(updated);
            updatedTasks = tasks.map(t => t.id === taskData.id ? updated : t);
            setTasks(updatedTasks);
            showToast('Đã cập nhật công việc thành công!', 'success');

            if (settings.autoCalendarSync) {
              syncTaskToCalendar(updated, showToast);
            }
          } else {
            // Create new task
            const newTask = {
              ...taskData,
              id: 'task-' + Date.now(),
              sequence: 1,
              status: taskData.status || 'pending',
              createdAt: new Date().toISOString()
            };
            await dbSaveTask(newTask);
            updatedTasks = [newTask, ...tasks];
            setTasks(updatedTasks);
            playAudioChime('success');
            showToast('Đã thêm công việc mới!', 'success');

            if (settings.autoCalendarSync) {
              syncTaskToCalendar(newTask, showToast);
            }
          }
          setIsModalOpen(false);
          setEditingTask(null);
        } catch (err) {
          showToast('Lỗi khi lưu dữ liệu!', 'error');
        }
      };

      // Delete Task
      const handleDeleteTask = async (id) => {
        try {
          await dbDeleteTask(id);
          setTasks(prev => prev.filter(t => t.id !== id));
          showToast('Đã xóa công việc!', 'info');
        } catch (err) {
          showToast('Lỗi khi xóa công việc!', 'error');
        }
      };

      // Toggle Task Completion Status
      const handleToggleStatus = async (task) => {
        const newStatus = task.status === 'completed' ? 'pending' : 'completed';
        const updated = { ...task, status: newStatus, sequence: (task.sequence || 1) + 1 };
        await dbSaveTask(updated);
        setTasks(prev => prev.map(t => t.id === task.id ? updated : t));
        if (newStatus === 'completed') {
          playAudioChime('success');
          triggerHaptic();
          showToast('Đã hoàn thành công việc! 🎉', 'success');
        }
      };

      // Toggle Subtask Completion
      const handleToggleSubtask = async (taskId, subId) => {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        const updatedSubtasks = (task.subtasks || []).map(s => 
          s.id === subId ? { ...s, completed: !s.completed } : s
        );
        const updated = { ...task, subtasks: updatedSubtasks };
        await dbSaveTask(updated);
        setTasks(prev => prev.map(t => t.id === taskId ? updated : t));
      };

      // Firebase Cloud Sync (2-way sync using REST API)
      const handleCloudSync = async () => {
        if (!settings.firebaseUrl || !settings.firebaseRoomId) {
          showToast('Vui lòng nhập URL Firebase và Mã phòng đồng bộ!', 'error');
          return;
        }

        try {
          showToast('Đang kết nối đám mây...', 'info');
          const cleanUrl = settings.firebaseUrl.replace(/\/$/, '');
          const endpoint = `${cleanUrl}/rooms/${settings.firebaseRoomId}.json`;

          // GET current data from cloud
          const getRes = await fetch(endpoint);
          const cloudData = await getRes.json();

          let mergedTasks = [...tasks];
          if (cloudData && Array.isArray(cloudData.tasks)) {
            const taskMap = new Map();
            [...cloudData.tasks, ...tasks].forEach(t => {
              if (!taskMap.has(t.id) || new Date(t.updatedAt || t.createdAt) > new Date(taskMap.get(t.id).updatedAt || taskMap.get(t.id).createdAt)) {
                taskMap.set(t.id, t);
              }
            });
            mergedTasks = Array.from(taskMap.values());
          }

          // PUT merged data back to cloud
          await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tasks: mergedTasks,
              lastSynced: new Date().toISOString()
            })
          });

          await dbSaveAllTasks(mergedTasks);
          setTasks(mergedTasks);
          playAudioChime('success');
          showToast('Đồng bộ đám mây thành công!', 'success');
        } catch (err) {
          console.error(err);
          showToast('Đồng bộ thất bại. Kiểm tra lại URL Firebase!', 'error');
        }
      };

      // Reset to Sample Data
      const handleResetData = async () => {
        setConfirmModal({
          title: 'Đặt lại dữ liệu ban đầu?',
          message: 'Tất cả công việc hiện tại sẽ bị xóa và khôi phục về danh sách mẫu ban đầu.',
          onConfirm: async () => {
            await dbSaveAllTasks(INITIAL_TASKS);
            setTasks(INITIAL_TASKS);
            setConfirmModal(null);
            showToast('Đã khôi phục dữ liệu mẫu!', 'success');
          }
        });
      };

      // Mobile Touch Gesture Swipe across viewport tabs
      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        touchEndX.current = e.changedTouches[0].clientX;
        const diffX = touchEndX.current - touchStartX.current;
        const diffY = e.changedTouches[0].clientY - touchStartY.current;

        // Ignore if vertical swipe dominates or horizontal displacement is small
        if (Math.abs(diffX) < 80 || Math.abs(diffY) > Math.abs(diffX) * 0.8) return;

        const tabs = ['overview', 'tasks', 'pomodoro', 'settings'];
        const currentIdx = tabs.indexOf(activeTab);

        if (diffX < 0 && currentIdx < tabs.length - 1) {
          setActiveTab(tabs[currentIdx + 1]);
          triggerHaptic();
        } else if (diffX > 0 && currentIdx > 0) {
          setActiveTab(tabs[currentIdx - 1]);
          triggerHaptic();
        }
      };

      // Filtered & Searched Tasks
      const filteredTasks = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const endOfToday = startOfToday + 86400000;

        return tasks.filter(t => {
          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = t.title.toLowerCase().includes(q);
            const matchDesc = (t.description || '').toLowerCase().includes(q);
            if (!matchTitle && !matchDesc) return false;
          }

          // Category filter
          if (filterCategory !== 'ALL' && t.category !== filterCategory) return false;

          // Priority filter
          if (filterPriority !== 'ALL' && t.priority !== filterPriority) return false;

          // Status / Quick Chips
          if (filterStatus === 'TODAY') {
            const due = t.dueDate ? new Date(t.dueDate).getTime() : 0;
            if (due < startOfToday || due >= endOfToday) return false;
          } else if (filterStatus === 'UPCOMING') {
            const due = t.dueDate ? new Date(t.dueDate).getTime() : 0;
            if (due < endOfToday) return false;
          } else if (filterStatus === 'OVERDUE') {
            const due = t.dueDate ? new Date(t.dueDate).getTime() : 0;
            if (due >= startOfToday || t.status === 'completed') return false;
          }

          return true;
        });
      }, [tasks, searchQuery, filterCategory, filterPriority, filterStatus]);

      // Computed Stats for Overview
      const stats = useMemo(() => {
        const total = tasks.length;
        const completed = tasks.filter(t => t.status === 'completed').length;
        const inProgress = tasks.filter(t => t.status === 'in_progress').length;
        const now = new Date().getTime();
        const overdue = tasks.filter(t => t.status !== 'completed' && t.dueDate && new Date(t.dueDate).getTime() < now).length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        // Categories count
        const cats = { 'Công việc': 0, 'Cá nhân': 0, 'Học tập': 0, 'Gia đình': 0, 'Khác': 0 };
        tasks.forEach(t => {
          cats[t.category || 'Khác'] = (cats[t.category || 'Khác'] || 0) + 1;
        });

        return { total, completed, inProgress, overdue, percentage, cats };
      }, [tasks]);

      return (
        <div 
          className="h-full flex flex-col lg:flex-row max-w-[1600px] mx-auto overflow-hidden relative"
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >

          <!-- DESKTOP LEFT SIDEBAR -->

            <div className="flex items-center gap-3 mb-8 px-2">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-glow">
                <i className="fa-solid fa-check-double text-lg"></i>
              </div>
              <div>
                <h1 className="font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-indigo-400">TaskFlow Việt</h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Lịch Điện Thoại 0-Download</p>
              </div>
            </div>

            {/* Quick Action Add Task */}
            <button
              onClick={() => { setEditingTask(null); setIsModalOpen(true); }}
              className="w-full py-3 px-4 mb-6 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-semibold flex items-center justify-center gap-2 shadow-lg shadow-brand-500/25 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
            >
              <i className="fa-solid fa-plus text-sm"></i>
              <span>Tạo việc mới</span>
            </button>

            {/* Nav Menu */}
            <nav className="flex-1 space-y-2">
              <button
                onClick={() => setActiveTab('overview')}
                className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl font-semibold transition-all ${
                  activeTab === 'overview'
                    ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'
                }`}
              >
                <i className="fa-solid fa-chart-pie text-lg"></i>
                <span>Tổng quan</span>
              </button>

              <button
                onClick={() => setActiveTab('tasks')}
                className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl font-semibold transition-all ${
                  activeTab === 'tasks'
                    ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'
                }`}
              >
                <i className="fa-solid fa-list-check text-lg"></i>
                <span>Công việc</span>
                {stats.total > 0 && (
                  <span className="ml-auto px-2 py-0.5 text-xs rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                    {stats.total}
                  </span>
                )}
              </button>

              <button
                onClick={() => setActiveTab('pomodoro')}
                className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl font-semibold transition-all ${
                  activeTab === 'pomodoro'
                    ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'
                }`}
              >
                <i className="fa-solid fa-stopwatch text-lg"></i>
                <span>Pomodoro</span>
              </button>

              <button
                onClick={() => setActiveTab('settings')}
                className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl font-semibold transition-all ${
                  activeTab === 'settings'
                    ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'
                }`}
              >
                <i className="fa-solid fa-gear text-lg"></i>
                <span>Cài đặt</span>
              </button>
            </nav>

            {/* Sidebar Footer Theme Switcher */}
            <div className="pt-4 border-t border-slate-200/60 dark:border-slate-800/60 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <i className={`fa-solid ${settings.darkMode ? 'fa-moon text-indigo-400' : 'fa-sun text-amber-500'}`}></i>
                <span className="text-xs font-semibold text-slate-600 dark:text-slate-400">
                  {settings.darkMode ? 'Chế độ Tối' : 'Chế độ Sáng'}
                </span>
              </div>
              <button
                onClick={toggleDarkMode}
                className="w-10 h-6 rounded-full bg-slate-300 dark:bg-slate-700 relative transition-colors p-0.5"
              >
                <div className={`w-5 h-5 rounded-full bg-white shadow-md transform transition-transform ${settings.darkMode ? 'translate-x-4' : 'translate-x-0'}`}></div>
              </button>
            </div>
          </aside>

          <!-- MAIN CONTENT VIEWPORT -->
          <main className="flex-1 flex flex-col h-full overflow-y-auto pb-24 lg:pb-6 p-4 sm:p-6 lg:p-8">
            
            <!-- MOBILE TOP HEADER BAR -->
            <div className="flex lg:hidden items-center justify-between mb-4 pb-2 border-b border-slate-200/50 dark:border-slate-800/50">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white">
                  <i className="fa-solid fa-check-double text-sm"></i>
                </div>
                <h1 className="font-bold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-indigo-400">TaskFlow Việt</h1>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={toggleDarkMode}
                  className="w-9 h-9 rounded-xl glass-panel-light dark:glass-panel-dark flex items-center justify-center text-slate-600 dark:text-slate-300"
                >
                  <i className={`fa-solid ${settings.darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-500'}`}></i>
                </button>
                <button
                  onClick={() => { setEditingTask(null); setIsModalOpen(true); }}
                  className="w-9 h-9 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-md shadow-brand-500/20"
                >
                  <i className="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>

            {/* TAB 1: OVERVIEW / DASHBOARD */}
            {activeTab === 'overview' && (
              <div className="space-y-6 animate-fade-in">
                {/* Banner Greeting */}
                <div className="p-6 rounded-3xl bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 text-white shadow-xl shadow-brand-500/15 relative overflow-hidden">
                  <div className="absolute right-0 top-0 bottom-0 opacity-15 flex items-center pr-6 pointer-events-none">
                    <i className="fa-solid fa-calendar-check text-9xl"></i>
                  </div>
                  <div className="relative z-10 max-w-xl">
                    <span className="inline-block px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-bold uppercase tracking-wider mb-3">
                      Quản lý công việc chuẩn Việt
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold mb-2">Đồng bộ Lịch Điện Thoại 1-Chạm!</h2>
                    <p className="text-slate-100 text-sm opacity-90 leading-relaxed">
                      Không cần Telegram hay app rườm rà. Chạm nút <strong>Lưu Lịch</strong> là công việc được đưa thẳng vào ứng dụng Lịch trên iPhone/Android để đổ chuông nhắc nhở!
                    </p>
                  </div>
                </div>

                {/* 4 Stats Cards */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="p-4 sm:p-5 rounded-3xl glass-panel-light dark:glass-panel-dark flex items-center justify-between shadow-sm">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Tổng công việc</p>
                      <p className="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">{stats.total}</p>
                    </div>
                    <div className="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-xl">
                      <i className="fa-solid fa-folder-open"></i>
                    </div>
                  </div>

                  <div className="p-4 sm:p-5 rounded-3xl glass-panel-light dark:glass-panel-dark flex items-center justify-between shadow-sm">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Đang thực hiện</p>
                      <p className="text-2xl font-extrabold text-amber-500 mt-1">{stats.inProgress}</p>
                    </div>
                    <div className="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl">
                      <i className="fa-solid fa-spinner"></i>
                    </div>
                  </div>

                  <div className="p-4 sm:p-5 rounded-3xl glass-panel-light dark:glass-panel-dark flex items-center justify-between shadow-sm">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Đã hoàn thành</p>
                      <p className="text-2xl font-extrabold text-emerald-500 mt-1">{stats.completed}</p>
                    </div>
                    <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-xl">
                      <i className="fa-solid fa-circle-check"></i>
                    </div>
                  </div>

                  <div className="p-4 sm:p-5 rounded-3xl glass-panel-light dark:glass-panel-dark flex items-center justify-between shadow-sm">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Quá hạn chót</p>
                      <p className="text-2xl font-extrabold text-rose-500 mt-1">{stats.overdue}</p>
                    </div>
                    <div className="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-500 flex items-center justify-center text-xl">
                      <i className="fa-solid fa-triangle-exclamation"></i>
                    </div>
                  </div>
                </div>

                {/* Progress & Category Section */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Circular Completion Ring */}
                  <div className="p-6 rounded-3xl glass-panel-light dark:glass-panel-dark flex flex-col items-center justify-center text-center">
                    <h3 className="font-bold text-slate-900 dark:text-white mb-4">Tiến độ hoàn thành</h3>
                    <div className="relative w-40 h-40 flex items-center justify-center">
                      <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" stroke="currentColor" strokeWidth="10" className="text-slate-200 dark:text-slate-800" fill="transparent" />
                        <circle
                          cx="50" cy="50" r="40" stroke="currentColor" strokeWidth="10"
                          className="text-brand-500 transition-all duration-1000 ease-out"
                          fill="transparent"
                          strokeDasharray={2 * Math.PI * 40}
                          strokeDashoffset={2 * Math.PI * 40 * (1 - stats.percentage / 100)}
                          strokeLinecap="round"
                        />
                      </svg>
                      <div className="absolute flex flex-col items-center">
                        <span className="text-3xl font-extrabold text-slate-900 dark:text-white">{stats.percentage}%</span>
                        <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">Đạt mục tiêu</span>
                      </div>
                    </div>
                  </div>

                  {/* Category Breakdown */}
                  <div className="p-6 rounded-3xl glass-panel-light dark:glass-panel-dark lg:col-span-2 flex flex-col justify-between">
                    <h3 className="font-bold text-slate-900 dark:text-white mb-4">Phân bổ theo danh mục</h3>
                    <div className="space-y-3.5">
                      {Object.entries(stats.cats).map(([cat, count]) => {
                        const pct = stats.total > 0 ? Math.round((count / stats.total) * 100) : 0;
                        return (
                          <div key={cat} className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold">
                              <span className="text-slate-700 dark:text-slate-300">{cat}</span>
                              <span className="text-slate-500">{count} việc ({pct}%)</span>
                            </div>
                            <div className="w-full h-2.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                              <div
                                className="h-full bg-gradient-to-r from-brand-500 to-indigo-500 rounded-full transition-all duration-700"
                                style={{ width: `${pct}%` }}
                              ></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Priority Tasks Today */}
                <div className="p-6 rounded-3xl glass-panel-light dark:glass-panel-dark">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <i className="fa-solid fa-fire text-amber-500"></i>
                      <span>Việc ưu tiên hôm nay</span>
                    </h3>
                    <button
                      onClick={() => setActiveTab('tasks')}
                      className="text-xs font-bold text-brand-600 dark:text-brand-400 hover:underline"
                    >
                      Xem tất cả <i className="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                  </div>

                  <div className="space-y-3">
                    {tasks.filter(t => t.priority === 'Cao' && t.status !== 'completed').slice(0, 3).map(task => (
                      <div key={task.id} className="p-4 rounded-2xl bg-slate-100/70 dark:bg-slate-900/60 flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3 overflow-hidden">
                          <button
                            onClick={() => handleToggleStatus(task)}
                            className="w-6 h-6 rounded-full border-2 border-slate-400 hover:border-brand-500 flex items-center justify-center shrink-0"
                          >
                            <i className="fa-solid fa-check text-xs text-transparent"></i>

                          <div className="truncate">
                            <h4 className="font-semibold text-sm text-slate-800 dark:text-slate-200 truncate">{task.title}</h4>
                            <p className="text-xs text-slate-500 truncate">{task.dueDate ? `Hạn: ${task.dueDate.replace('T', ' ')}` : 'Chưa có giờ hạn'}</p>
                          </div>
                        </div>

                        <button
                          onClick={() => syncTaskToCalendar(task, showToast)}
                          className="px-3 py-1.5 rounded-xl bg-brand-500/10 hover:bg-brand-500/20 text-brand-600 dark:text-brand-400 text-xs font-bold flex items-center gap-1.5 shrink-0"

                      </div>

            {/* TAB 2: TASKS MANAGEMENT (LIST & KANBAN) */}
            {activeTab === 'tasks' && (
              <div className="space-y-5 animate-fade-in">

                  {/* Search Input */}

                      className="w-full pl-10 pr-4 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark text-sm border focus:outline-none focus:ring-2 focus:ring-brand-500"

                          await dbSaveSetting('firebaseRoomId', val);
                        }}
                        className="w-full px-3.5 py-2 rounded-2xl glass-panel-light dark:glass-panel-dark text-xs border focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    <button
                      onClick={handleCloudSync}
                      className="w-full py-2.5 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-transform active:scale-98"
                    >
                      <i className="fa-solid fa-rotate"></i>
                      <span>Đồng bộ dữ liệu ngay</span>
                    </button>
                  </div>
                </div>

                {/* Reset & Backup Section */}
                <div className="p-6 rounded-3xl glass-panel-light dark:glass-panel-dark space-y-4">
                  <h3 className="font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <i className="fa-solid fa-sliders text-amber-500"></i>
                    <span>Khôi phục & Sao lưu</span>
                  </h3>

                  <div className="flex flex-wrap items-center gap-3">
                    <button
                      onClick={handleResetData}
                      className="px-4 py-2.5 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 text-xs font-bold flex items-center gap-2"
                    >
                      <i className="fa-solid fa-trash-arrow-up"></i>
                      <span>Đặt lại dữ liệu mẫu</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          <!-- MOBILE FLOATING LIQUID GLASS BOTTOM NAV BAR (< 1024px) -->
          <nav className="flex lg:hidden fixed bottom-4 left-4 right-4 h-16 rounded-full glass-panel-light dark:glass-panel-dark shadow-2xl border border-white/40 dark:border-white/10 items-center justify-around z-40 px-2 select-none">
            {[
              { key: 'overview', icon: 'fa-chart-pie', label: 'Tổng quan' },
              { key: 'tasks', icon: 'fa-list-check', label: 'Công việc' },
              { key: 'pomodoro', icon: 'fa-stopwatch', label: 'Pomodoro' },
              { key: 'settings', icon: 'fa-gear', label: 'Cài đặt' }
            ].map(tab => (
              <button
                key={tab.key}
                onClick={() => { setActiveTab(tab.key); triggerHaptic(); }}
                className={`flex flex-col items-center justify-center w-16 h-12 rounded-2xl transition-all ${
                  activeTab === tab.key
                    ? 'text-brand-600 dark:text-brand-400 font-bold scale-105'
                    : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'
                }`}
              >
                <i className={`fa-solid ${tab.icon} text-lg mb-0.5`}></i>
                <span className="text-[10px]">{tab.label}</span>
              </button>
            ))}
          </nav>

          <!-- CREATE / EDIT TASK MODAL (Slide-up Bottom Sheet on Mobile) -->
          {isModalOpen && (
            <TaskModal
              task={editingTask}
              onClose={() => setIsModalOpen(false)}
              onSave={handleSaveTask}
            />
          )}

          <!-- CONFIRMATION DIALOG MODAL -->
          {confirmModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
              <div className="p-6 rounded-3xl glass-panel-light dark:glass-panel-dark max-w-sm w-full space-y-4 text-center shadow-2xl border border-white/20">
                <i className="fa-solid fa-circle-question text-4xl text-amber-500 mb-2"></i>
                <h3 className="font-bold text-lg text-slate-900 dark:text-white">{confirmModal.title}</h3>
                <p className="text-xs text-slate-500">{confirmModal.message}</p>
                <div className="flex items-center gap-3 pt-2">
                  <button
                    onClick={() => setConfirmModal(null)}
                    className="flex-1 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark text-xs font-bold text-slate-600 dark:text-slate-300"
                  >
                    Hủy bỏ
                  </button>
                  <button
                    onClick={confirmModal.onConfirm}
                    className="flex-1 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-bold shadow-md"
                  >
                    Xác nhận
                  </button>
                </div>
              </div>
            </div>
          )}

          <!-- TOAST NOTIFICATION -->
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark shadow-2xl border border-brand-500/30 flex items-center gap-2.5 text-xs font-bold animate-slide-up text-slate-900 dark:text-white">
              <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-emerald-500' : toast.type === 'error' ? 'fa-circle-xmark text-rose-500' : 'fa-circle-info text-sky-500'} text-base`}></i>
              <span>{toast.msg}</span>
            </div>
          )}

        </div>
      );
    }

    // --- 6. TASK CREATE / EDIT MODAL COMPONENT ---
    function TaskModal({ task, onClose, onSave }) {
      const [title, setTitle] = useState(task?.title || '');
      const [description, setDescription] = useState(task?.description || '');
      const [category, setCategory] = useState(task?.category || 'Công việc');
      const [priority, setPriority] = useState(task?.priority || 'Trung bình');
      const [dueDate, setDueDate] = useState(task?.dueDate || new Date(Date.now() + 86400000).toISOString().slice(0, 16));
      const [leadTime, setLeadTime] = useState(task?.leadTime || '30m');
      const [subtasks, setSubtasks] = useState(task?.subtasks || []);
      const [newSubtaskTitle, setNewSubtaskTitle] = useState('');

      const handleAddSubtask = () => {
        if (!newSubtaskTitle.trim()) return;
        setSubtasks([...subtasks, { id: 'sub-' + Date.now(), title: newSubtaskTitle.trim(), completed: false }]);
        setNewSubtaskTitle('');
      };

      const handleRemoveSubtask = (id) => {
        setSubtasks(subtasks.filter(s => s.id !== id));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onSave({
          ...task,
          title: title.trim(),
          description: description.trim(),
          category,
          priority,
          dueDate,
          leadTime,
          subtasks
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
          <div className="w-full sm:max-w-lg p-6 rounded-t-3xl sm:rounded-3xl glass-panel-light dark:glass-panel-dark shadow-2xl border border-white/20 max-h-[90vh] overflow-y-auto animate-slide-up">
            <div className="flex items-center justify-between mb-5">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <i className="fa-solid fa-pen-to-square text-brand-500"></i>
                <span>{task ? 'Chỉnh sửa công việc' : 'Thêm công việc mới'}</span>
              </h3>
              <button onClick={onClose} className="w-8 h-8 rounded-full glass-panel-light dark:glass-panel-dark text-slate-500 flex items-center justify-center">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs font-semibold">
              <div>
                <label className="block text-slate-600 dark:text-slate-400 mb-1">Tên công việc (*):</label>
                <input
                  type="text"
                  required
                  placeholder="Nhập tiêu đề việc cần làm..."
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark text-sm border focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div>
                <label className="block text-slate-600 dark:text-slate-400 mb-1">Ghi chú chi tiết:</label>
                <textarea
                  rows="3"
                  placeholder="Mô tả nội dung công việc..."
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark text-xs border focus:outline-none focus:ring-2 focus:ring-brand-500"
                ></textarea>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-600 dark:text-slate-400 mb-1">Danh mục:</label>
                  <select
                    value={category}
                    onChange={e => setCategory(e.target.value)}
                    className="w-full px-3 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark border focus:outline-none"
                  >
                    <option value="Công việc">Công việc</option>
                    <option value="Cá nhân">Cá nhân</option>
                    <option value="Học tập">Học tập</option>
                    <option value="Gia đình">Gia đình</option>
                    <option value="Khác">Khác</option>
                  </select>
                </div>

                <div>
                  <label className="block text-slate-600 dark:text-slate-400 mb-1">Độ ưu tiên:</label>
                  <select
                    value={priority}
                    onChange={e => setPriority(e.target.value)}
                    className="w-full px-3 py-2.5 rounded-2xl glass-panel-light dark:glass-panel-dark border focus:outline-none"
                  >
                    <option value="Cao">Cao 🔥</option>
                    <option value="Trung bình">Trung bình ⚡</option>
                    <option value="Thấp">Thấp ☕</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-600 dark:text-slate-400 mb-1">Thời hạn (Hạn chót):</label>
                  <input
                    type="datetime-local"
                    value={dueDate}
                    onChange={e => setDueDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-2xl glass-panel-light dark:glass-panel-dark border focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-slate-600 dark:text-slate-400 mb-1">Báo thức Lịch trước:</label>
                  <select
                    value={leadTime}
                    onChange={e => setLeadTime(e.target.value)}
                    className="w-full px-3 py-2 rounded-2xl glass-panel-light dark:glass-panel-dark border focus:outline-none"
                  >
                    <option value="0m">Đúng giờ hạn chót</option>
                    <option value="15m">Trước 15 phút</option>
                    <option value="30m">Trước 30 phút</option>
                    <option value="1h">Trước 1 tiếng</option>
                    <option value="1d">Trước 1 ngày</option>
                  </select>
                </div>
              </div>

              {/* Subtasks checklist generator */}
              <div className="pt-2">
                <label className="block text-slate-600 dark:text-slate-400 mb-1">Danh sách việc phụ (Subtasks):</label>
                <div className="flex gap-2 mb-2">
                  <input
                    type="text"
                    placeholder="Nhập việc nhỏ..."
                    value={newSubtaskTitle}
                    onChange={e => setNewSubtaskTitle(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddSubtask(); } }}
                    className="flex-1 px-3 py-1.5 rounded-xl glass-panel-light dark:glass-panel-dark border focus:outline-none"
                  />
                  <button
                    type="button"
                    onClick={handleAddSubtask}
                    className="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold"
                  >
                    Thêm
                  </button>
                </div>

                <div className="space-y-1.5 max-h-32 overflow-y-auto">
                  {subtasks.map(s => (
                    <div key={s.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-100 dark:bg-slate-900/60">
                      <span>{s.title}</span>
                      <button type="button" onClick={() => handleRemoveSubtask(s.id)} className="text-rose-500">
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex items-center gap-3 pt-4">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-3 rounded-2xl glass-panel-light dark:glass-panel-dark text-slate-600 dark:text-slate-300 font-bold"
                >
                  Hủy bỏ
                </button>
                <button
                  type="submit"
                  className="flex-1 py-3 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold shadow-lg shadow-brand-500/25"
                >
                  {task ? 'Lưu cập nhật' : 'Tạo việc mới'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
